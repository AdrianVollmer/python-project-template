_subdirectory: template
_min_copier_version: "9.0.0"
_exclude:
  - |-
    {% if not is_app %}
    src/{{ package_name }}/cli.py
    src/{{ package_name }}/__main__.py
    {% endif %}
  - |-
    {% if not with_web_frontend %}
    frontend
    {% endif %}

project_name:
  type: str
  help: Human-readable project name (e.g. "My Cool Tool")
  validator: >-
    {% if not project_name %}Project name cannot be empty{% endif %}

project_description:
  type: str
  help: One-line project description
  default: ""

project_summary:
  type: str
  when: false
  default: >-
    {{ (project_description or project_name).rstrip('.!?') }}.

package_name:
  type: str
  help: Importable Python package name (snake_case)
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z_][a-z0-9_]*$')) %}
    package_name must be a valid Python identifier: lowercase letters, digits, underscores, not starting with a digit
    {% endif %}

author_name:
  type: str
  help: Author full name

author_email:
  type: str
  help: Author email

is_app:
  type: bool
  help: Is this a CLI application? (adds click, a __main__.py entry point, and a cli.py scaffold)
  default: false

with_web_frontend:
  type: bool
  help: Include a web frontend? (adds deno as a dev dependency, a frontend/ TypeScript scaffold, and deno fmt/lint/check/test/bundle tasks)
  default: false
